<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>统一管理后台 · Admin</title>
<link rel="stylesheet" href="/api/v1/library/static/vendor/bootstrap.min.css" />
<style>
  [v-cloak] { display: none; }
  body { background: #f5f6f8; }
  .sidebar { width: 200px; min-height: 100vh; background: #1f2937; color: #cbd5e1; position: sticky; top: 0; }
  .sidebar .brand { color: #fff; font-weight: 700; }
  .sidebar .nav-link { color: #cbd5e1; border-radius: 6px; }
  .sidebar .nav-link:hover { background: #374151; color: #fff; }
  .sidebar .nav-link.active { background: #2563eb; color: #fff; }
  .main { flex: 1; min-width: 0; }
  .id-mono { font-family: var(--bs-font-monospace); font-size: .76rem; color: #495057; }
  .j-name { font-size: .76rem; color: #6c757d; overflow-wrap: anywhere; }
  td.j-col { min-width: 130px; max-width: 200px; }
  td.title-col { min-width: 230px; max-width: 360px; }
  td.title-col .t-title { overflow-wrap: anywhere; }
  .table td, .table th { vertical-align: middle; }
  .row-off { opacity: .55; }
  .suggest { background: #fff8e1 !important; border-color: #ffe08a !important; }
  .stat-card .num { font-size: 1.5rem; font-weight: 700; line-height: 1; white-space: nowrap; }
  .stat-card .lbl { font-size: .72rem; color: #6c757d; }
  .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1080; overflow-y: auto; }
  .toast-wrap { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); z-index: 1090; }
  .list-scroll { overflow-x: auto; }
  .filters .form-select, .filters .form-control { width: auto; min-width: 120px; }
  .review-tbl td, .review-tbl th { font-size: .82rem; padding: .3rem .4rem; }
  pre.cfg { background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 8px; max-height: 60vh; overflow: auto; font-size: .8rem; }
</style>
</head>
<body>
<div id="app" v-cloak>
  <div class="d-flex">
    <aside class="sidebar p-3">
      <div class="brand mb-3">统一管理后台</div>
      <ul class="nav flex-column gap-1">
        <li class="nav-item" v-for="m in modules" :key="m.key">
          <a class="nav-link py-2" :class="{active: active===m.key}" href="#" @click.prevent="active=m.key">{{ m.label }}</a>
        </li>
      </ul>
      <div class="small text-secondary mt-4" style="opacity:.6">索引/评估/报告等运维在各自模块;文献管理只管文献。</div>
    </aside>
    <main class="main p-3">
      <component :is="active + '-module'"></component>
    </main>
  </div>
  <div class="toast-wrap">
    <div class="toast align-items-center border-0 text-bg-dark" role="status" aria-live="polite" :class="{show: toast.show, 'text-bg-danger': !toast.ok}">
      <div class="d-flex"><div class="toast-body">{{ toast.msg }}</div></div>
    </div>
  </div>
</div>

<script src="/api/v1/library/static/vendor/vue.global.prod.js"></script>
<script>
const LIB = "/api/v1/library", ADMIN = "/api/v1/admin", V1 = "/api/v1";
async function http(url, opts) {
  const r = await fetch(url, opts);
  const body = r.headers.get("content-type")?.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error((body && body.detail) || r.statusText);
  return body;
}
const scrObj = s => ({ authority: s[0], recency: s[1], relevance: s[2], accessibility: s[3], safety_applicability: s[4] });

/* ============================ 文献管理模块 ============================ */
const LiteratureModule = {
  inject: ["toast"],
  template: `
  <div>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="mb-0">文献管理</h5>
      <button class="btn btn-sm btn-primary" @click="openImport">+ 添加文献</button>
    </div>
    <div class="alert alert-light border py-2 px-3 small">索引 / 重切请到左侧「索引检索运维」模块;此处「上传全文」只附加 PDF,不建索引(状态显示 PDF 待建)。</div>

    <div class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="card-title mb-0">{{ viewTrash ? '废纸篓' : '列表' }} <span class="text-secondary fw-normal">（{{ total }}）</span></h6>
        </div>
        <div class="filters d-flex flex-wrap gap-2 mb-3" v-if="!viewTrash">
          <select class="form-select form-select-sm" v-model="filters.tier"><option value="">全部 Tier</option><option>A</option><option>B</option><option>C</option></select>
          <select class="form-select form-select-sm" v-model="filters.topic"><option value="">全部主题</option><option v-for="t in taxTopics" :key="t">{{ t }}</option></select>
          <select class="form-select form-select-sm" v-model="filters.evidence_class"><option value="">全部证据类别</option><option v-for="e in taxEvid" :key="e">{{ e }}</option></select>
          <select class="form-select form-select-sm" v-model="filters.include"><option value="">启用+禁用</option><option value="true">仅启用</option><option value="false">仅禁用</option></select>
          <select class="form-select form-select-sm" v-model="filters.journal_tier"><option value="">全部期刊级</option><option value="1">T1 顶刊</option><option value="2">T2 主流</option><option value="3">T3 较弱</option></select>
          <input class="form-control form-control-sm" v-model="filters.query" @keyup.enter="page=1;loadList()" placeholder="搜索 id/标题/机构/期刊" />
          <button class="btn btn-sm btn-outline-secondary" @click="page=1;loadList()">刷新</button>
          <button class="btn btn-sm btn-outline-warning" @click="openDupScan">🔍 查重</button>
          <button class="btn btn-sm btn-outline-secondary" @click="toggleTrash">🗑 废纸篓</button>
        </div>
        <div class="d-flex gap-2 mb-3" v-else>
          <button class="btn btn-sm btn-secondary" @click="toggleTrash">← 返回列表</button>
          <button class="btn btn-sm btn-outline-danger" @click="emptyTrash">清空废纸篓</button>
        </div>
        <div class="list-scroll">
          <table class="table table-sm table-hover align-middle">
            <thead class="table-light"><tr><th>Tier</th><th>ID / 标题</th><th>期刊</th><th>主题</th><th>证据类别</th><th>质量</th><th v-if="!viewTrash">全文</th><th class="text-end">操作</th></tr></thead>
            <tbody :class="{'opacity-50 pe-none': loading}">
              <tr v-if="!sources.length"><td :colspan="viewTrash?7:8" class="text-secondary small py-3">{{ loading ? '加载中…' : (viewTrash ? '废纸篓是空的' : '无结果') }}</td></tr>
              <tr v-for="s in sources" :key="s.source_id" :class="{'row-off': !viewTrash && !s.include}">
                <td><span class="badge rounded-pill" :class="tierClass(s.tier)">{{ s.tier }}</span></td>
                <td class="title-col"><div class="id-mono">{{ s.source_id }}</div><div class="t-title">{{ s.title }}</div>
                  <div class="small text-secondary" v-if="!viewTrash">{{ s.organization }} · {{ s.year }} · {{ s.region }}</div>
                  <div class="small text-secondary" v-else>删除于 {{ s._trashed_at }}<span v-if="s._trash_reason"> · {{ s._trash_reason }}</span></div></td>
                <td class="j-col"><span class="badge" :class="jtClass(s.journal_tier)">{{ s.journal_tier ? 'T'+s.journal_tier : '—' }}</span><div class="j-name">{{ s.journal || s.organization }}</div></td>
                <td><span class="badge text-bg-light border text-dark fw-normal">{{ s.topic }}</span></td>
                <td class="small text-secondary">{{ s.evidence_class }}</td>
                <td>{{ s.source_quality_score }}</td>
                <td v-if="!viewTrash"><span class="badge" :class="ftClass(s.source_id)">{{ ftLabel(s.source_id) }}</span></td>
                <td class="text-end text-nowrap">
                  <template v-if="!viewTrash">
                    <button v-if="s.include" class="btn btn-sm btn-outline-secondary" @click="setInc(s.source_id,false)">禁用</button>
                    <button v-else class="btn btn-sm btn-outline-success" @click="setInc(s.source_id,true)">启用</button>
                    <button class="btn btn-sm btn-outline-primary" @click="openUpload(s.source_id)">{{ hasFt(s.source_id) ? '重传全文' : '上传全文' }}</button>
                    <button v-if="hasFt(s.source_id)" class="btn btn-sm btn-outline-danger" @click="removeFt(s.source_id)">移除全文</button>
                    <button class="btn btn-sm btn-outline-danger" @click="del(s.source_id)">删除</button>
                  </template>
                  <template v-else>
                    <button class="btn btn-sm btn-outline-success" @click="restore(s.source_id)">恢复</button>
                    <button class="btn btn-sm btn-outline-danger" @click="purgeOne(s.source_id)">彻底删除</button>
                  </template>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <nav class="d-flex justify-content-between align-items-center" aria-label="分页" v-if="total > 0">
          <span class="small text-secondary">第 {{ page }} / {{ pageCount }} 页 · 共 {{ total }} 条</span>
          <div class="btn-group btn-group-sm" v-if="pageCount > 1">
            <button class="btn btn-outline-secondary" :disabled="page<=1||loading" @click="page=1;loadList()">« 首页</button>
            <button class="btn btn-outline-secondary" :disabled="page<=1||loading" @click="page--;loadList()">‹ 上一页</button>
            <button class="btn btn-outline-secondary" :disabled="page>=pageCount||loading" @click="page++;loadList()">下一页 ›</button>
            <button class="btn btn-outline-secondary" :disabled="page>=pageCount||loading" @click="page=pageCount;loadList()">末页 »</button>
          </div>
          <select class="form-select form-select-sm" style="width:auto" v-model.number="pageSize" @change="page=1;loadList()">
            <option :value="15">15/页</option><option :value="25">25/页</option><option :value="50">50/页</option><option :value="100">100/页</option>
          </select>
        </nav>
      </div>
    </div>

    <div class="modal-back" v-if="showImport" @click.self="closeImport" role="dialog" aria-modal="true" aria-label="添加文献">
      <div class="card shadow" style="max-width:920px;margin:5vh auto;"><div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-2"><h6 class="mb-0">添加文献</h6><button class="btn-close" aria-label="关闭" @click="closeImport"></button></div>
        <ul class="nav nav-pills mb-3 gap-1">
          <li class="nav-item"><a class="nav-link py-1" :class="{active:importTab=='doi'}" href="#" @click.prevent="importTab='doi'">批量 DOI/链接/标题</a></li>
          <li class="nav-item"><a class="nav-link py-1" :class="{active:importTab=='pdf'}" href="#" @click.prevent="importTab='pdf'">批量 PDF</a></li>
          <li class="nav-item"><a class="nav-link py-1" :class="{active:importTab=='manual'}" href="#" @click.prevent="importTab='manual'">手动单条</a></li>
        </ul>
        <div v-if="importTab=='doi'">
          <p class="small text-secondary mb-1">每行一个,识别后汇入审核表。</p>
          <textarea class="form-control form-control-sm mb-2" rows="4" v-model="doiText" placeholder="10.1161/...&#10;论文标题"></textarea>
          <button class="btn btn-sm btn-primary" :disabled="importing" @click="identifyDoi">{{ importing?'识别中…':'识别' }}</button>
        </div>
        <div v-else-if="importTab=='pdf'">
          <p class="small text-secondary mb-1">可多选 PDF,逐个识别后汇入审核表。</p>
          <input class="form-control form-control-sm mb-2" type="file" accept="application/pdf" multiple @change="identifyPdfs" />
          <span class="small text-secondary" v-if="importing">识别中…</span>
        </div>
        <div v-else class="row g-2">
          <div class="col-md-6"><label class="form-label small mb-0">source_id *</label><input class="form-control form-control-sm" v-model="manual.source_id"></div>
          <div class="col-md-6"><label class="form-label small mb-0">标题 *</label><input class="form-control form-control-sm" v-model="manual.title"></div>
          <div class="col-md-6"><label class="form-label small mb-0">机构 *</label><input class="form-control form-control-sm" v-model="manual.organization"></div>
          <div class="col-md-6"><label class="form-label small mb-0">URL/DOI</label><input class="form-control form-control-sm" v-model="manual.url"></div>
          <div class="col-md-3"><label class="form-label small mb-0">年份 *</label><input class="form-control form-control-sm" type="number" v-model.number="manual.year"></div>
          <div class="col-md-3"><label class="form-label small mb-0">地区 *</label><input class="form-control form-control-sm" v-model="manual.region"></div>
          <div class="col-md-3"><label class="form-label small mb-0">主题 *</label><select class="form-select form-select-sm" v-model="manual.topic"><option v-for="t in taxTopics" :key="t">{{ t }}</option></select></div>
          <div class="col-md-3"><label class="form-label small mb-0">证据类别 *</label><select class="form-select form-select-sm" v-model="manual.evidence_class"><option v-for="e in taxEvid" :key="e">{{ e }}</option></select></div>
          <div class="col-md-6"><label class="form-label small mb-0">allowed_uses(逗号)*</label><input class="form-control form-control-sm" v-model="manual.allowed_uses"></div>
          <div class="col-md-6"><label class="form-label small mb-0">评分 a,r,r,a,s *</label><input class="form-control form-control-sm" v-model="manual.screening"></div>
          <div class="col-12"><button class="btn btn-sm btn-primary" @click="addManual">添加到知识库</button></div>
        </div>
        <div v-if="reviewRows.length" class="mt-3">
          <div class="d-flex justify-content-between align-items-center mb-1"><span class="small fw-semibold">审核（{{ reviewRows.length }}）· 黄色为待确认建议<span v-if="dupChecking" class="text-secondary">· 查重中…</span></span><button class="btn btn-sm btn-success" :disabled="importing" @click="submitBatch">全部添加</button></div>
          <div class="list-scroll"><table class="table table-sm review-tbl align-middle">
            <thead class="table-light"><tr><th>source_id</th><th>标题</th><th>疑似重复</th><th>主题</th><th>证据类别</th><th>评分(5)</th><th>期刊级</th><th></th></tr></thead>
            <tbody><tr v-for="(r,i) in reviewRows" :key="i" :class="{'table-warning': r._resolved===false, 'table-danger': r._dup && r._dup.length}">
              <td><input class="form-control form-control-sm" style="min-width:150px" v-model="r.source_id"></td>
              <td style="max-width:220px"><input class="form-control form-control-sm" v-model="r.title"></td>
              <td style="max-width:170px"><span v-if="r._dup && r._dup.length" class="badge text-bg-danger" :title="r._dup.map(m=>m.source_id+'（'+m.reason+'）').join('；')">⚠ 疑似 {{ r._dup.length }} 篇</span><span v-else class="text-secondary small">—</span>
                <div v-if="r._dup && r._dup.length" class="small text-danger" style="overflow-wrap:anywhere">{{ r._dup.map(m=>m.source_id).join('、') }}</div></td>
              <td><select class="form-select form-select-sm" :class="{suggest:sug(r,'topic')}" v-model="r.topic"><option v-for="t in taxTopics" :key="t">{{ t }}</option></select></td>
              <td><select class="form-select form-select-sm" :class="{suggest:sug(r,'evidence_class')}" v-model="r.evidence_class"><option v-for="e in taxEvid" :key="e">{{ e }}</option></select></td>
              <td><input class="form-control form-control-sm" style="min-width:110px" :class="{suggest:sug(r,'screening')}" v-model="r.scrStr"></td>
              <td><select class="form-select form-select-sm" v-model.number="r.journal_tier" style="width:auto"><option :value="null">—</option><option :value="1">T1</option><option :value="2">T2</option><option :value="3">T3</option></select></td>
              <td><button class="btn btn-sm btn-outline-danger" @click="reviewRows.splice(i,1)">×</button></td>
            </tr></tbody></table></div>
          <div v-if="batchResult" class="small mt-1"><span class="text-success">成功 {{ batchResult.added }}</span> · <span class="text-warning-emphasis">重复 {{ batchDup }}</span> · <span class="text-danger">失败 {{ batchErr }}</span>
            <span v-for="r in batchResult.results.filter(x=>x.action!=='added')" :key="r.source_id" class="d-block text-secondary">{{ r.source_id }}: {{ r.action }} — {{ r.detail }}</span></div>
        </div>
      </div></div>
    </div>

    <div class="modal-back" v-if="showUpload" @click.self="showUpload=false" role="dialog" aria-modal="true" aria-label="上传全文">
      <div class="card shadow" style="max-width:460px;margin:8vh auto;"><div class="card-body">
        <h6 class="card-title">上传全文 PDF · {{ uploadId }}</h6>
        <p class="small text-secondary">只附加 PDF、不建索引;建索引到「索引检索运维」模块统一做。</p>
        <label class="form-label small mb-1">访问 / 授权模式 access_mode（管理员对版权负责）</label>
        <select class="form-select form-select-sm mb-2" v-model="uploadMode"><option v-for="m in (ftMeta.access_modes||[])" :key="m">{{ m }}</option></select>
        <label class="form-label small mb-1">选择 PDF 文件</label>
        <input class="form-control form-control-sm mb-3" type="file" accept="application/pdf" @change="uploadFile=$event.target.files[0]" />
        <div class="d-flex justify-content-end gap-2"><button class="btn btn-sm btn-outline-secondary" @click="showUpload=false">取消</button>
          <button class="btn btn-sm btn-primary" :disabled="uploading" @click="doUpload">{{ uploading?'附加中…':'附加 PDF' }}</button></div>
      </div></div>
    </div>

    <div class="modal-back" v-if="showDup" @click.self="showDup=false" role="dialog" aria-modal="true" aria-label="全库查重">
      <div class="card shadow" style="max-width:960px;margin:5vh auto;"><div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <h6 class="mb-0">全库查重 <span class="text-secondary fw-normal" v-if="!dupLoading">· {{ dupClusters.length }} 个疑似重复簇</span></h6>
          <div class="d-flex gap-2"><button class="btn btn-sm btn-outline-secondary" :disabled="dupLoading" @click="loadDupScan">重新扫描</button><button class="btn-close" aria-label="关闭" @click="showDup=false"></button></div>
        </div>
        <p class="small text-secondary mb-2"><span class="badge text-bg-danger">确定</span> = DOI/PMID 相同（强）；<span class="badge text-bg-warning">疑似</span> = 仅标题+年份相同（弱，请人工核对机构/链接后再决定）。删除为移入废纸篓，可恢复。</p>
        <div v-if="dupLoading" class="text-secondary py-3">扫描中…</div>
        <div v-else-if="!dupClusters.length" class="alert alert-success py-2 px-3 small mb-0">未发现疑似重复。</div>
        <div v-else>
          <div v-for="(cl,ci) in dupClusters" :key="ci" class="border rounded p-2 mb-2" :class="cl.strong ? 'border-danger' : 'border-warning'">
            <div class="small mb-1"><span class="badge" :class="cl.strong ? 'text-bg-danger' : 'text-bg-warning'">{{ cl.strong ? '确定' : '疑似' }}</span> <span class="text-secondary">依据: {{ cl.reasons.join(', ') }} · {{ cl.size }} 篇</span></div>
            <div class="list-scroll"><table class="table table-sm review-tbl align-middle mb-0">
              <thead class="table-light"><tr><th>source_id / 标题</th><th>机构 / 期刊</th><th>年</th><th>Tier</th><th>启用</th><th></th></tr></thead>
              <tbody><tr v-for="m in cl.members" :key="m.source_id">
                <td style="max-width:300px"><div class="id-mono">{{ m.source_id }}</div><div style="overflow-wrap:anywhere">{{ m.title }}</div><div class="small text-secondary" v-if="m.doi">doi: {{ m.doi }}</div></td>
                <td style="max-width:180px"><div style="overflow-wrap:anywhere">{{ m.organization }}</div><div class="j-name">{{ m.journal }}</div></td>
                <td>{{ m.year }}</td>
                <td><span class="badge" :class="tierClass(m.tier)">{{ m.tier }}</span></td>
                <td><span class="badge" :class="m.include ? 'text-bg-success' : 'text-bg-light border text-secondary'">{{ m.include ? '启用' : '禁用' }}</span></td>
                <td><button class="btn btn-sm btn-outline-danger" @click="trashFromDup(m.source_id)">移入废纸篓</button></td>
              </tr></tbody></table></div>
          </div>
        </div>
      </div></div>
    </div>
  </div>`,
  data() {
    return {
      taxonomy: null, ftMeta: {}, ftMap: {},
      sources: [], total: 0, page: 1, pageSize: 25, _seq: 0,
      filters: { tier: "", topic: "", evidence_class: "", include: "", journal_tier: "", query: "" },
      viewTrash: false, loading: false,
      showImport: false, importTab: "doi", doiText: "", importing: false, reviewRows: [], batchResult: null,
      manual: { source_id: "", title: "", organization: "", url: "", year: 2026, region: "global", topic: "", evidence_class: "research_context", allowed_uses: "", screening: "4,4,4,4,4" },
      showUpload: false, uploadId: "", uploadMode: "", uploadFile: null, uploading: false,
      showDup: false, dupClusters: [], dupLoading: false, dupChecking: false,
    };
  },
  computed: {
    taxTopics() { return this.taxonomy ? this.taxonomy.topics : []; },
    taxEvid() { return this.taxonomy ? this.taxonomy.evidence_classes : []; },
    pageCount() { return Math.max(1, Math.ceil(this.total / this.pageSize)); },
    batchDup() { return this.batchResult ? this.batchResult.results.filter(r => r.action === "duplicate").length : 0; },
    batchErr() { return this.batchResult ? this.batchResult.results.filter(r => r.action === "error").length : 0; },
  },
  watch: { "filters.tier"() { this.reload(); }, "filters.topic"() { this.reload(); }, "filters.evidence_class"() { this.reload(); }, "filters.include"() { this.reload(); }, "filters.journal_tier"() { this.reload(); } },
  methods: {
    reload() { this.page = 1; this.loadList(); },
    tierClass(t) { return { A: "text-bg-success", B: "text-bg-warning", C: "text-bg-secondary" }[t] || "text-bg-secondary"; },
    jtClass(t) { return { 1: "text-bg-success", 2: "text-bg-primary", 3: "text-bg-danger" }[t] || "text-bg-light border text-secondary"; },
    hasFt(id) { const r = this.ftMap[id]; return r && (r.has_pdf || r.indexed); },
    ftClass(id) { const r = this.ftMap[id]; if (r && r.indexed) return "text-bg-success"; if (r && r.has_pdf) return "text-bg-warning"; return "text-bg-light border text-secondary"; },
    ftLabel(id) { const r = this.ftMap[id]; if (r && r.indexed) return "✓ 已索引"; if (r && r.has_pdf) return "PDF 待建"; return "—"; },
    sug(r, f) { return (r._suggested_fields || []).includes(f); },
    async loadFulltext() { const s = await http(LIB + "/fulltext"); this.ftMeta = s; this.ftMap = {}; s.sources.forEach(r => (this.ftMap[r.source_id] = r)); },
    async loadList() {
      const seq = ++this._seq; this.loading = true;
      try {
        let d;
        if (this.viewTrash) d = await http(`${LIB}/trash?limit=${this.pageSize}&offset=${(this.page - 1) * this.pageSize}`);
        else { const p = new URLSearchParams({ limit: this.pageSize, offset: (this.page - 1) * this.pageSize }); for (const [k, v] of Object.entries(this.filters)) if (v) p.set(k, v); d = await http(LIB + "/sources?" + p.toString()); }
        if (seq !== this._seq) return;
        const pc = Math.max(1, Math.ceil(d.total / this.pageSize)); if (this.page > pc) { this.page = pc; return this.loadList(); }
        this.sources = d.sources; this.total = d.total;
      } catch (e) { if (seq === this._seq) { this.toast(e.message, false); this.sources = []; } }
      finally { if (seq === this._seq) this.loading = false; }
    },
    async refresh() { await this.loadFulltext(); await this.loadList(); },
    async setInc(id, v) { try { await http(`${LIB}/sources/${encodeURIComponent(id)}/include`, { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify({ include: v }) }); this.toast(v ? "已启用" : "已禁用"); await this.refresh(); } catch (e) { this.toast(e.message, false); } },
    async del(id) { if (!confirm("把『" + id + "』移入废纸篓？")) return; try { await http(`${LIB}/sources/${encodeURIComponent(id)}`, { method: "DELETE" }); this.toast("已移入废纸篓"); await this.refresh(); } catch (e) { this.toast(e.message, false); } },
    async restore(id) { try { await http(`${LIB}/sources/${encodeURIComponent(id)}/restore`, { method: "POST" }); this.toast("已恢复"); await this.refresh(); } catch (e) { this.toast(e.message, false); } },
    async purgeOne(id) { if (!confirm("彻底删除『" + id + "』？不可恢复。")) return; try { await http(`${LIB}/trash/${encodeURIComponent(id)}`, { method: "DELETE" }); this.toast("已彻底删除"); await this.refresh(); } catch (e) { this.toast(e.message, false); } },
    toggleTrash() { this.viewTrash = !this.viewTrash; this.page = 1; this.loadList(); },
    async emptyTrash() { const n = (await http(LIB + "/trash")).total; if (!n) return this.toast("废纸篓已空"); if (!confirm(`清空废纸篓（${n} 条）？不可恢复。`)) return; try { const r = await http(LIB + "/trash/empty", { method: "POST" }); this.toast(`已清空：${r.purged} 条`); await this.refresh(); } catch (e) { this.toast(e.message, false); } },
    openUpload(id) { this.uploadId = id; this.uploadFile = null; this.uploadMode = (this.ftMeta.access_modes || [])[0] || "public_pdf"; this.showUpload = true; },
    async doUpload() {
      if (!this.uploadFile) return this.toast("请选择 PDF", false);
      this.uploading = true;
      try { const buf = await this.uploadFile.arrayBuffer();
        await http(`${LIB}/sources/${encodeURIComponent(this.uploadId)}/fulltext?access_mode=${encodeURIComponent(this.uploadMode)}&rebuild=false`, { method: "POST", headers: { "content-type": "application/pdf" }, body: buf });
        this.toast("已附加 PDF（去运维模块建索引）"); this.showUpload = false; await this.refresh();
      } catch (e) { this.toast(e.message, false); } finally { this.uploading = false; }
    },
    async removeFt(id) { if (!confirm("移除『" + id + "』的本地全文？（目录记录保留）")) return; try { await http(`${LIB}/sources/${encodeURIComponent(id)}/fulltext?rebuild=false`, { method: "DELETE" }); this.toast("已移除全文"); await this.refresh(); } catch (e) { this.toast(e.message, false); } },
    openDupScan() { this.showDup = true; this.loadDupScan(); },
    async loadDupScan() { this.dupLoading = true; try { const d = await http(LIB + "/duplicates"); this.dupClusters = d.clusters; } catch (e) { this.toast(e.message, false); this.dupClusters = []; } finally { this.dupLoading = false; } },
    async trashFromDup(id) { if (!confirm("把『" + id + "』移入废纸篓？（可在废纸篓恢复）")) return; try { await http(`${LIB}/sources/${encodeURIComponent(id)}?reason=duplicate`, { method: "DELETE" }); this.toast("已移入废纸篓"); await this.loadDupScan(); await this.refresh(); } catch (e) { this.toast(e.message, false); } },
    async checkDup() {
      const rows = this.reviewRows.slice();  // snapshot: map results back by reference, not shifting index
      const items = rows.map(r => ({ title: r.title, doi: r.doi, url: r.url, year: r.year }));
      if (!items.length) return;
      this.dupChecking = true;
      try { const d = await http(LIB + "/duplicates/check", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ items }) });
        d.results.forEach(res => { if (rows[res.index]) rows[res.index]._dup = res.matches; });
      } catch (e) { /* 预警失败不阻断导入 */ } finally { this.dupChecking = false; }
    },
    openImport() { this.showImport = true; this.reviewRows = []; this.batchResult = null; this.doiText = ""; },
    closeImport() { if (this.reviewRows.length && !confirm("放弃未提交的审核行？")) return; this.showImport = false; },
    draftToRow(d) { const scr = d.screening || {}; const s = [scr.authority, scr.recency, scr.relevance, scr.accessibility, scr.safety_applicability];
      return { source_id: d.source_id || "", title: d.title || "", organization: (d.organization && d.organization !== "Unknown") ? d.organization : "", url: d.url || (d.doi ? "https://doi.org/" + d.doi : ""), doi: d.doi || "", year: d.year || null, region: "global", topic: d.topic || "research_context", evidence_class: d.evidence_class || "research_context", allowed_uses: (d.allowed_uses || []).join(","), journal: d.journal || d.container || "", journal_tier: d.journal_tier || null, source_type: d.source_type || "", scrStr: s.every(x => x != null) ? s.join(",") : "4,4,4,4,4", _suggested_fields: d._suggested_fields || [], _resolved: d._resolved !== false, _dup: [] }; },
    async identifyDoi() { const queries = this.doiText.split("\n").map(x => x.trim()).filter(Boolean); if (!queries.length) return this.toast("请输入", false); this.importing = true;
      try { const d = await http(LIB + "/autofill/batch", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ queries }) }); d.drafts.forEach(x => this.reviewRows.push(this.draftToRow(x))); this.toast(`识别 ${d.count} 条`); this.checkDup(); } catch (e) { this.toast(e.message, false); } finally { this.importing = false; } },
    async identifyPdfs(ev) { const files = [...ev.target.files]; if (!files.length) return; this.importing = true;
      try { const drafts = await Promise.all(files.map(async f => { try { const buf = await f.arrayBuffer(); return await http(LIB + "/autofill/pdf", { method: "POST", headers: { "content-type": "application/pdf" }, body: buf }); } catch (e) { return { _resolved: false, title: f.name, _warning: e.message }; } }));
        drafts.forEach(x => this.reviewRows.push(this.draftToRow(x))); this.toast(`识别 ${drafts.length} 个 PDF`); this.checkDup(); } catch (e) { this.toast(e.message, false); } finally { this.importing = false; ev.target.value = ""; } },
    rowToItem(r) { const scr = r.scrStr.split(",").map(x => parseInt(x, 10)); const item = { source_id: r.source_id, title: r.title, organization: r.organization || "Unknown", year: r.year || 2026, region: r.region || "global", topic: r.topic, evidence_class: r.evidence_class, allowed_uses: r.allowed_uses.split(",").map(x => x.trim()).filter(Boolean), screening: scrObj(scr) };
      if (r.url) item.url = r.url; if (r.doi) item.doi = r.doi; if (r.journal) item.journal = r.journal; if (r.journal_tier) item.journal_tier = r.journal_tier; if (r.source_type) item.source_type = r.source_type; return item; },
    async submitBatch() {
      for (let i = 0; i < this.reviewRows.length; i++) { const scr = this.reviewRows[i].scrStr.split(",").map(x => parseInt(x, 10)); if (scr.length !== 5 || scr.some(isNaN)) return this.toast(`第 ${i + 1} 行评分需 5 个整数`, false); }
      const items = this.reviewRows.map(r => this.rowToItem(r)); this.importing = true;
      try { this.batchResult = await http(LIB + "/sources/batch", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ items }) }); this.toast(`已添加 ${this.batchResult.added} / ${items.length}`);
        const ok = new Set(this.batchResult.results.filter(x => x.action === "added").map(x => x.source_id)); this.reviewRows = this.reviewRows.filter(r => !ok.has(r.source_id)); await this.refresh();
      } catch (e) { this.toast(e.message, false); } finally { this.importing = false; } },
    async addManual() { const m = this.manual; const scr = m.screening.split(",").map(x => parseInt(x, 10)); if (scr.length !== 5 || scr.some(isNaN)) return this.toast("评分需 5 个整数", false);
      const body = { source_id: m.source_id, title: m.title, organization: m.organization, year: m.year, region: m.region, topic: m.topic, evidence_class: m.evidence_class, allowed_uses: m.allowed_uses.split(",").map(x => x.trim()).filter(Boolean), screening: scrObj(scr) }; if (m.url) body.url = m.url;
      try { const r = await http(LIB + "/sources", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }); this.toast(`已添加 ${r.source_id}（Tier ${r.source.tier}，${r.source.source_quality_score}）`); this.showImport = false; await this.refresh(); } catch (e) { this.toast(e.message, false); } },
  },
  async mounted() {
    // Named handler + removal on unmount: modules mount/unmount on every sidebar
    // switch (no <keep-alive>), so an anonymous listener would leak per switch.
    this._onKeydown = (e) => { if (e.key !== "Escape") return; if (this.showUpload) this.showUpload = false; else if (this.showDup) this.showDup = false; else if (this.showImport) this.closeImport(); };
    window.addEventListener("keydown", this._onKeydown);
    try { this.taxonomy = await http(LIB + "/taxonomy"); this.manual.topic = this.taxTopics[0]; await this.refresh(); } catch (e) { this.toast("加载失败：" + e.message, false); }
  },
  unmounted() { if (this._onKeydown) window.removeEventListener("keydown", this._onKeydown); },
};

      <div class="col-md-9" v-if="sel">
        <div class="small text-secondary mb-1">{{ files[sel].path }} · 读取方: {{ files[sel].read_by }}</div>
        <pre class="cfg">{{ pretty(files[sel].content) }}</pre>
      </div>
    </div>
  </div>`,
  data() { return { files: null, note: "", sel: "" }; },
  methods: { pretty(o) { return JSON.stringify(o, null, 2); } },
  async mounted() { try { const d = await http(ADMIN + "/config"); this.files = d.files; this.note = d.note; this.sel = Object.keys(d.files)[0]; } catch (e) { this.toast(e.message, false); } },
};

const app = Vue.createApp({
  data() { return { active: "dashboard", modules: [ { key: "dashboard", label: "概览" }, { key: "literature", label: "文献管理" }, { key: "ops", label: "索引检索运维" }, { key: "config", label: "配置" } ], toast: { show: false, msg: "", ok: true }, _tT: null }; },
  provide() { return { toast: (msg, ok = true) => this.say(msg, ok), go: (k) => { this.active = k; } }; },
  methods: { say(msg, ok = true) { this.toast = { show: true, msg, ok }; clearTimeout(this._tT); this._tT = setTimeout(() => (this.toast.show = false), 2800); } },
});
app.component("dashboard-module", DashboardModule);
app.component("literature-module", LiteratureModule);
app.component("ops-module", OpsModule);
app.component("config-module", ConfigModule);
app.mount("#app");
</script>
</body>
</html>
