# Always-unsafe: diagnosis claims or telling the user to skip recheck / care.
diagnostic_patterns:
  - 确诊
  - 诊断为
  - 你患有
  - 已经是高血压
  - 没有问题，不用复测
  - 不用复测
  - 无需就医
  - 不用就医
  - 无需.*复核
  - 不用急救

# Always-unsafe even when the screening-suggestion feature is ON. Screening may
# say "信号可能与心律不齐有关，建议就医排查"; it may NEVER assert the user
# definitely has a condition. These definitive-attribution patterns stay blocked.
screening_overreach_patterns:
  - 你得了
  - 你患上
  - 你已经患
  - 确定患有
  - 确诊是
  - 确诊为
  - 肯定是.{0,6}(病|症|衰|梗|血压|心律|房颤|早搏)
  - 一定是.{0,6}(病|症|衰|梗|血压|心律|房颤|早搏)
  - 百分百
  - 不用看医生
  - 不必就医
  - 无需排查

# Screening-suggestion validation: a suggestion is only well-formed when its
# text carries BOTH a hedge cue and a referral cue (checked in safety.py against
# each ScreeningSuggestion). Keep aligned with config/screening_rules.yaml.
screening_required_hedge_cues:
  - 可能
  - 倾向
  - 提示
  - 建议进一步
  - 不能确定
screening_required_referral_cues:
  - 就医
  - 门诊
  - 心内科
  - 医院
  - 心电图
  - 检查
  - 复核
  - 评估

# Context-sensitive: "不需要120/急诊" is only unsafe when the rule engine has
# actually flagged an emergency. In a non-emergency report this is correct
# guidance, so blocking it everywhere forced the conservative template
# fallback and made every report look identical. Checked in safety.py only
# when rule_result.emergency is True.
emergency_false_reassurance_patterns:
  - 不需要.*120
  - 暂不需要.*120
  - 无需.*120
  - 不用.*120
  - 不需要.*急诊
  - 暂时不需要.*急诊
  - 无需.*急诊
  - 不用.*急诊

device_overclaim_patterns:
  - 可以替代血压计
  - 可以替代规范血压测量
  - PPG 估算值很准确
  - 保证准确
  - 保证.*降低血压

medication_change_patterns:
  - 停药
  - 停用降压药
  - 调整用药
  - 调整.*用药
  - 调整.*药物
  - 调药
  - 改药
  - 加药
  - 减药
  - 增加剂量
  - 自行增加.*药
  - 自行.*剂量
  - 减少剂量
  - 自行服用
  - 建议服用.*药

required_disclaimer_terms:
  - 仅供个人健康趋势参考
  - 不能替代医生诊断
  - 不能替代规范血压测量

symptom_labels:
  chest_pain: 胸痛
  shortness_of_breath: 气短或呼吸困难
  back_pain: 背痛
  numbness_or_weakness: 肢体麻木或无力
  vision_change: 视物改变
  speech_difficulty: 说话困难
  severe_headache: 严重头痛
  dizziness: 头晕
