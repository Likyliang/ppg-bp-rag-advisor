[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppg-bp-rag-agent"
version = "0.1.0"
description = "RAG-Agent for conservative health explanations of PPG-based blood pressure estimates."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.23",
  "pydantic>=2.5,<3.0",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "streamlit>=1.30",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "argon2-cffi>=23.1,<26.0",
  "cryptography>=42.0,<46.0",
  "portalocker>=2.8,<4.0",
]

[project.optional-dependencies]
test = [
  "pytest>=7.4",
  "httpx>=0.24",
]
rag = [
  "chromadb>=0.4",
  "pypdf>=4.0,<6.0",
  "sentence-transformers>=2.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
